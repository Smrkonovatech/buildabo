<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <!-- Subtle ambient glow / silhouette backdrop -->
  <defs>
    <linearGradient id="bglGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
  </defs>

  <!-- Ground Baseline -->
  <line x1="0" y1="72" x2="340" y2="72" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />

  <!-- 1. LEFT: Bangalore Heritage / Town Hall & Clock Tower (x: 10 - 90) -->
  <!-- Heritage Gable / Bungalow -->
  <path d="M12 72V58l9-7 9 7v14" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" stroke-linejoin="round" />
  <line x1="21" y1="51" x2="21" y2="72" stroke="#ffffff" stroke-width="1.1" stroke-dasharray="2 3" stroke-opacity="0.6" />

  <!-- Mayo Hall / Clock Tower -->
  <path d="M34 72V36h14v36" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.5" />
  <!-- Spire & Finial -->
  <path d="M34 36l7-14 7 14" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.5" />
  <line x1="41" y1="22" x2="41" y2="15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="41" cy="42" r="2.5" fill="#ffffff" stroke="none" />
  <line x1="37" y1="52" x2="37" y2="66" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" />
  <line x1="45" y1="52" x2="45" y2="66" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.8" />

  <!-- Attara Kacheri (High Court) Colonnade -->
  <path d="M52 72V46h36v26" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <path d="M50 46h40" stroke="#ffffff" stroke-width="1.6" />
  <!-- Pediment triangle -->
  <path d="M62 46l8-6 8 6" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <!-- Columns -->
  <line x1="57" y1="48" x2="57" y2="72" stroke="#ffffff" stroke-width="1.2" />
  <line x1="64" y1="48" x2="64" y2="72" stroke="#ffffff" stroke-width="1.2" />
  <line x1="71" y1="48" x2="71" y2="72" stroke="#ffffff" stroke-width="1.2" />
  <line x1="78" y1="48" x2="78" y2="72" stroke="#ffffff" stroke-width="1.2" />
  <line x1="84" y1="48" x2="84" y2="72" stroke="#ffffff" stroke-width="1.2" />

  <!-- Intermediate Block -->
  <path d="M88 72V48h14v24" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <circle cx="95" cy="54" r="1.5" fill="#ffffff" />
  <circle cx="95" cy="62" r="1.5" fill="#ffffff" />

  <!-- 2. CENTER: VIDHANA SOUDHA (x: 102 - 208) -->
  <!-- Main Wing Body -->
  <path d="M102 72V45h104v27" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.5" />
  <!-- Parapet / Cornice -->
  <line x1="100" y1="45" x2="208" y2="45" stroke="#ffffff" stroke-width="1.6" />

  <!-- Left Dravidian Pavilion Dome -->
  <path d="M108 45V36c0-4 4-8 8-8s8 4 8 8v9" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.3" />
  <line x1="116" y1="28" x2="116" y2="23" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />

  <!-- Right Dravidian Pavilion Dome -->
  <path d="M184 45V36c0-4 4-8 8-8s8 4 8 8v9" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.3" />
  <line x1="192" y1="28" x2="192" y2="23" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />

  <!-- Vidhana Soudha Central Dome & Drum -->
  <rect x="138" y="32" width="32" height="13" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <!-- Arched drum windows -->
  <path d="M142 41v-4c0-1.2 1-2 2-2s2 .8 2 2v4" stroke="#ffffff" stroke-width="1" />
  <path d="M152 41v-4c0-1.2 1-2 2-2s2 .8 2 2v4" stroke="#ffffff" stroke-width="1" />
  <path d="M162 41v-4c0-1.2 1-2 2-2s2 .8 2 2v4" stroke="#ffffff" stroke-width="1" />

  <!-- Majestic Grand Central Dome -->
  <path d="M136 32c0-12 8-19 18-19s18 7 18 19" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.6" />
  <!-- Ashoka Kalasa Spire -->
  <line x1="154" y1="13" x2="154" y2="5" stroke="#ffffff" stroke-width="1.7" stroke-linecap="round" />
  <circle cx="154" cy="5" r="1.5" fill="#ffffff" />
  <!-- Symmetrical Dome ribs -->
  <path d="M144 31c2-8 6-15 10-18 4 3 8 10 10 18" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.8" />

  <!-- Grand Colonnade Portico -->
  <path d="M132 45h44v17h-44z" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <!-- Portico Pediment -->
  <path d="M130 45l24-7 24 7" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.5" />
  <!-- Six Grand Columns -->
  <line x1="136" y1="46" x2="136" y2="62" stroke="#ffffff" stroke-width="1.3" />
  <line x1="143" y1="46" x2="143" y2="62" stroke="#ffffff" stroke-width="1.3" />
  <line x1="150" y1="46" x2="150" y2="62" stroke="#ffffff" stroke-width="1.3" />
  <line x1="158" y1="46" x2="158" y2="62" stroke="#ffffff" stroke-width="1.3" />
  <line x1="165" y1="46" x2="165" y2="62" stroke="#ffffff" stroke-width="1.3" />
  <line x1="172" y1="46" x2="172" y2="62" stroke="#ffffff" stroke-width="1.3" />

  <!-- Grand Ceremonial Flight of Steps (Vidhana Soudha steps) -->
  <polygon points="128,72 134,62 174,62 180,72" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <line x1="131" y1="67" x2="177" y2="67" stroke="#ffffff" stroke-width="1.1" />

  <!-- Windows along Vidhana Soudha Wings -->
  <rect x="105" y="50" width="4" height="6" rx="1" fill="#ffffff" fill-opacity="0.8" />
  <rect x="113" y="50" width="4" height="6" rx="1" fill="#ffffff" fill-opacity="0.8" />
  <rect x="121" y="50" width="4" height="6" rx="1" fill="#ffffff" fill-opacity="0.8" />
  <rect x="183" y="50" width="4" height="6" rx="1" fill="#ffffff" fill-opacity="0.8" />
  <rect x="191" y="50" width="4" height="6" rx="1" fill="#ffffff" fill-opacity="0.8" />
  <rect x="199" y="50" width="4" height="6" rx="1" fill="#ffffff" fill-opacity="0.8" />

  <!-- 3. RIGHT: UB CITY & MODERN SILICON VALLEY TOWERS (x: 212 - 335) -->
  <!-- Connecting Mid-Rise Tower -->
  <path d="M210 72V42h16v30" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <line x1="215" y1="46" x2="215" y2="68" stroke="#ffffff" stroke-width="1.1" stroke-opacity="0.7" />
  <line x1="221" y1="46" x2="221" y2="68" stroke="#ffffff" stroke-width="1.1" stroke-opacity="0.7" />

  <!-- UB City Tower 1 (Bangalore's iconic skyscraper with soaring crown) -->
  <path d="M230 72V18l14-14 14 14v54" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.6" stroke-linejoin="round" />
  <!-- Soaring Architectural Spire -->
  <line x1="244" y1="4" x2="244" y2="0" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" />
  <circle cx="244" cy="0" r="1.4" fill="#ffffff" />
  <!-- Sloping glass crown ribs -->
  <line x1="230" y1="18" x2="258" y2="18" stroke="#ffffff" stroke-width="1.4" />
  <line x1="235" y1="13" x2="253" y2="13" stroke="#ffffff" stroke-width="1.1" />
  <!-- Sleek Vertical Facade Fins -->
  <line x1="237" y1="20" x2="237" y2="72" stroke="#ffffff" stroke-width="1.1" stroke-opacity="0.85" />
  <line x1="244" y1="20" x2="244" y2="72" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.95" />
  <line x1="251" y1="20" x2="251" y2="72" stroke="#ffffff" stroke-width="1.1" stroke-opacity="0.85" />
  <!-- Horizontal floor markers -->
  <line x1="230" y1="36" x2="258" y2="36" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
  <line x1="230" y1="54" x2="258" y2="54" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />

  <!-- Modern Commercial Glass Tower (World Trade Center Bangalore / IT High-Rise) -->
  <path d="M264 72V24h26v48" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.5" />
  <line x1="262" y1="24" x2="292" y2="24" stroke="#ffffff" stroke-width="1.6" />
  <!-- Tower Antenna / Mast -->
  <line x1="277" y1="24" x2="277" y2="14" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round" />
  <circle cx="277" cy="14" r="1" fill="#ffffff" />
  <!-- Window Grid -->
  <line x1="272" y1="28" x2="272" y2="70" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
  <line x1="282" y1="28" x2="282" y2="70" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
  <line x1="266" y1="38" x2="288" y2="38" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />
  <line x1="266" y1="52" x2="288" y2="52" stroke="#ffffff" stroke-width="0.9" stroke-opacity="0.5" />

  <!-- Stepped Tech Park Tower -->
  <path d="M294 72V38h16v34" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <path d="M310 72V48h18v24" fill="url(#bglGrad)" stroke="#ffffff" stroke-width="1.4" />
  <!-- Rooftop Communications Dishes / Masts -->
  <line x1="302" y1="38" x2="302" y2="30" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" />
  <circle cx="302" cy="30" r="1" fill="#ffffff" />
  <line x1="319" y1="48" x2="319" y2="43" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" />
  <!-- Windows -->
  <rect x="298" y="44" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="304" y="44" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="298" y="54" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="304" y="54" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="314" y="54" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="320" y="54" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="314" y="62" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
  <rect x="320" y="62" width="3" height="4" fill="#ffffff" fill-opacity="0.85" />
</svg>
